# Builds this fork of OptiScaler on GitHub's Windows runners and publishes the result.
#
# Put this file at .github/workflows/build-fork.yml in your fork.
# Runs when you push to a branch named xefg-* (or master), or by hand from the Actions tab.
# Needs no secrets: it uses the GITHUB_TOKEN that GitHub provides automatically.
#
# Built from the steps in upstream's just_build_no_signature.yml / build.yml.

name: Build fork

on:
  workflow_dispatch:
  push:
    branches: [ "master", "xefg-*" ]

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Work out the file name
      id: get_version
      shell: powershell
      run: |
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) { Write-Error "File not found: $resourceFile"; exit 1 }

        function Get-Version-Component {
            param ([string]$pattern, [string]$replacement)
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) { return ($line.Line -replace $replacement).Trim() }
            Write-Error "Pattern not found: $pattern"; exit 1
        }

        $major  = Get-Version-Component 'VER_MAJOR_VERSION'  '#define VER_MAJOR_VERSION\s+'
        $minor  = Get-Version-Component 'VER_MINOR_VERSION'  '#define VER_MINOR_VERSION\s+'
        $hotfix = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $build  = Get-Version-Component 'VER_BUILD_NUMBER'   '#define VER_BUILD_NUMBER\s+'

        $version = "v$major.$minor.$hotfix-pre$build"
        $date    = Get-Date -Format "yyyyMMdd"
        $name    = "OptiScaler_${version}_xefg_${date}_${{ github.run_number }}"

        "version=$version"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$name"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Output "Building $name"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }} /verbosity:minimal

    - name: Compress the build
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r ${{ github.workspace }}\$zipName ${{ github.workspace }}\x64\Release\a\*.*

    # Kept for 90 days on the run page, handy for quick tests
    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error

    # Permanent download on the Releases page
    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: xefg-${{ github.run_number }}
        name: ${{ steps.get_version.outputs.filename }}
        prerelease: true
        target_commitish: ${{ github.sha }}
        body: |
          Build of ${{ github.repository }} at ${{ github.sha }}
          (branch ${{ github.ref_name }}).
        files: ${{ github.workspace }}/${{ steps.get_version.outputs.filename }}.7z
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
