# Builds the fork on every push and uploads the ready-to-copy game folder.
# No code signing, no releases, no secrets: just the artifact.
name: Fork build

on:
  push:
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }} /verbosity:minimal

    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.0
      with:
        name: OptiScaler-fork-${{ github.run_number }}
        path: x64/Release/a
        compression-level: 9
        if-no-files-found: error
